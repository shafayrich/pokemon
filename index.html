<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>⚡ PokéHub – Collect, Battle & Trade</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='45' fill='%23c44536' stroke='%23333' stroke-width='5'/><circle cx='50' cy='50' r='18' fill='white' stroke='%23333' stroke-width='5'/></svg>">
    <style>
        :root {
            --bg: #1e1e2a;
            --surface: #2a2a3a;
            --card-bg: #3a3a50;
            --text: #f0f0f5;
            --text-secondary: #b0b0c0;
            --accent: #c47a5a;
            --gold: #c9a96e;
            --green: #6b8e6a;
            --blue: #5a7a8a;
            --purple: #8a7a8a;
            --border: rgba(255, 255, 255, 0.08);
            --radius: 16px;
            --shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            overflow-x: hidden;
        }
        .header {
            background: var(--surface);
            border-bottom: 2px solid var(--gold);
            padding: 16px 32px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 16px;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: var(--shadow);
        }
        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
            font-weight: 800;
            font-size: 1.6rem;
            color: var(--gold);
        }
        .pokeball-logo {
            width: 40px;
            height: 40px;
            background: conic-gradient(#c44536 0% 50%, white 50% 100%);
            border-radius: 50%;
            border: 3px solid #333;
            position: relative;
        }
        .pokeball-logo::after {
            content: '';
            position: absolute;
            width: 14px;
            height: 14px;
            background: white;
            border-radius: 50%;
            border: 3px solid #333;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }
        .trainer-box {
            display: flex;
            align-items: center;
            gap: 10px;
            background: var(--bg);
            border-radius: 30px;
            padding: 6px 6px 6px 20px;
            border: 1px solid var(--border);
        }
        .trainer-box input {
            background: transparent;
            border: none;
            color: var(--text);
            font-size: 1rem;
            width: 140px;
            outline: none;
        }
        .trainer-box button {
            padding: 8px 20px;
            border-radius: 25px;
            background: var(--accent);
            color: white;
            border: none;
            cursor: pointer;
            font-weight: 700;
            font-size: 0.9rem;
        }
        .coins {
            background: var(--bg);
            padding: 10px 20px;
            border-radius: 30px;
            border: 1px solid var(--border);
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 1rem;
        }
        .coin-icon {
            display: inline-block;
            width: 24px;
            height: 24px;
            background: var(--gold);
            border-radius: 50%;
            border: 2px solid #fff3cd;
        }
        .nav-tabs {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }
        .nav-btn {
            padding: 10px 24px;
            border-radius: 30px;
            background: transparent;
            border: 2px solid transparent;
            color: var(--text-secondary);
            cursor: pointer;
            font-weight: 700;
            font-size: 0.95rem;
            transition: 0.2s;
        }
        .nav-btn:hover {
            background: rgba(255, 255, 255, 0.08);
            color: var(--text);
        }
        .nav-btn.active {
            background: var(--accent);
            color: white;
            border-color: transparent;
        }
        .main-content {
            padding: 32px;
            max-width: 1400px;
            margin: 0 auto;
        }
        .tab-view {
            display: none;
        }
        .tab-view.visible {
            display: block;
        }
        .card-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 20px;
        }
        .pokemon-card {
            background: var(--card-bg);
            border-radius: var(--radius);
            overflow: hidden;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            border: 2px solid var(--border);
            box-shadow: var(--shadow);
        }
        .pokemon-card:hover {
            transform: translateY(-6px);
            box-shadow: 0 16px 30px rgba(0, 0, 0, 0.5);
            border-color: var(--gold);
        }
        .card-sprite {
            background: rgba(0, 0, 0, 0.25);
            padding: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 150px;
        }
        .card-sprite img {
            max-width: 100%;
            max-height: 100%;
            image-rendering: pixelated;
        }
        .card-info {
            padding: 16px;
            text-align: center;
        }
        .card-name {
            font-weight: 800;
            text-transform: capitalize;
            font-size: 1.05rem;
            margin-bottom: 4px;
        }
        .rarity-badge {
            font-size: 0.7rem;
            font-weight: 700;
            padding: 4px 12px;
            border-radius: 12px;
            display: inline-block;
            margin: 6px 0;
        }
        .rarity-common {
            background: #7a7a8c;
            color: white;
        }
        .rarity-uncommon {
            background: var(--green);
            color: white;
        }
        .rarity-rare {
            background: var(--blue);
            color: white;
        }
        .rarity-ultrarare {
            background: var(--purple);
            color: white;
        }
        .rarity-legendary {
            background: linear-gradient(135deg, #f0d060, #b8923b);
            color: #1a1a24;
        }
        .type-badge {
            display: inline-block;
            padding: 4px 14px;
            border-radius: 14px;
            font-size: 0.7rem;
            font-weight: 700;
            text-transform: capitalize;
            margin: 3px;
            color: #1a1a24;
        }
        .type-grass {
            background: #78c850;
        }
        .type-fire {
            background: #f08030;
        }
        .type-water {
            background: #6890f0;
        }
        .type-electric {
            background: #f8d030;
        }
        .type-psychic {
            background: #f85888;
        }
        .type-dragon {
            background: #7038f8;
            color: white;
        }
        .type-normal {
            background: #a8a878;
        }
        .type-fighting {
            background: #c03028;
            color: white;
        }
        .type-dark {
            background: #705848;
            color: white;
        }
        .type-steel {
            background: #b8b8d0;
        }
        .type-ice {
            background: #98d8d8;
        }
        .type-poison {
            background: #a040a0;
            color: white;
        }
        .type-ground {
            background: #e0c068;
        }
        .type-flying {
            background: #a890f0;
        }
        .type-bug {
            background: #a8b820;
        }
        .type-rock {
            background: #b8a038;
        }
        .type-ghost {
            background: #705898;
            color: white;
        }
        .type-fairy {
            background: #ee99ac;
        }
        .pack-selection {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            margin-bottom: 30px;
        }
        .pack-card {
            background: var(--surface);
            border-radius: var(--radius);
            padding: 24px;
            text-align: center;
            border: 2px solid var(--border);
            width: 180px;
            cursor: pointer;
            transition: 0.2s;
        }
        .pack-card:hover {
            border-color: var(--gold);
            background: #3a3a52;
        }
        .pack-icon {
            font-size: 3rem;
            margin-bottom: 12px;
            display: flex;
            justify-content: center;
            gap: 8px;
        }
        .pack-icon span {
            background: var(--accent);
            color: white;
            padding: 12px;
            border-radius: 8px;
            font-weight: bold;
        }
        .flip-container {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            justify-content: center;
            margin-top: 20px;
        }
        .flip-card {
            width: 150px;
            height: 220px;
            perspective: 1000px;
            cursor: pointer;
        }
        .flip-card-inner {
            position: relative;
            width: 100%;
            height: 100%;
            transition: transform 0.6s;
            transform-style: preserve-3d;
        }
        .flip-card.flipped .flip-card-inner {
            transform: rotateY(180deg);
        }
        .flip-card-front,
        .flip-card-back {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            border-radius: var(--radius);
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: var(--shadow);
        }
        .flip-card-back {
            background: linear-gradient(145deg, #4a4a5c, #3a3a4a);
            border: 2px solid var(--gold);
            font-size: 2.5rem;
            color: var(--gold);
        }
        .flip-card-front {
            background: var(--card-bg);
            transform: rotateY(180deg);
            flex-direction: column;
            padding: 16px;
            border: 2px solid var(--border);
            text-align: center;
        }
        .flip-card-front img {
            width: 90px;
            height: 90px;
            image-rendering: pixelated;
        }
        .pack-rip-area {
            text-align: center;
            margin: 30px 0;
        }
        .pack-image {
            width: 200px;
            cursor: grab;
            transition: transform 0.3s;
        }
        .pack-image:active {
            cursor: grabbing;
        }
        .trade-offer {
            background: var(--surface);
            border-radius: var(--radius);
            padding: 20px;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 20px;
            flex-wrap: wrap;
            border: 2px solid var(--border);
        }
        .btn {
            padding: 10px 24px;
            border-radius: 30px;
            border: none;
            font-weight: 700;
            cursor: pointer;
            transition: 0.2s;
            font-size: 0.9rem;
        }
        .btn-primary {
            background: var(--accent);
            color: white;
        }
        .btn-primary:hover {
            background: #b86845;
        }
        .btn-accept {
            background: var(--green);
            color: white;
        }
        .btn-accept:hover {
            background: #5a7d5a;
        }
        .btn-decline {
            background: #6e6e6e;
            color: white;
        }
        .btn-gold {
            background: var(--gold);
            color: #1a1a24;
            font-weight: 800;
        }
        .tutorial-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.85);
            z-index: 300;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .tutorial-box {
            background: var(--surface);
            border-radius: 24px;
            padding: 40px;
            max-width: 600px;
            width: 90%;
            text-align: center;
            border: 2px solid var(--gold);
            position: relative;
        }
        .tutorial-close {
            position: absolute;
            top: 16px;
            right: 20px;
            font-size: 1.8rem;
            cursor: pointer;
            color: #aaa;
            background: none;
            border: none;
        }
        .tutorial-close:hover {
            color: #fff;
        }
        .tutorial-step {
            font-size: 1.2rem;
            margin: 24px 0;
            color: var(--text-secondary);
            line-height: 1.6;
        }
        .tutorial-nav {
            display: flex;
            justify-content: space-between;
            margin-top: 32px;
        }
        .index-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
            font-size: 0.95rem;
            background: var(--surface);
            border-radius: var(--radius);
            overflow: hidden;
        }
        .index-table th,
        .index-table td {
            padding: 12px 16px;
            border-bottom: 1px solid var(--border);
            text-align: left;
        }
        .battle-screen {
            display: flex;
            gap: 40px;
            flex-wrap: wrap;
            justify-content: center;
        }
        .battle-pokemon {
            background: var(--surface);
            border-radius: var(--radius);
            padding: 24px;
            text-align: center;
            border: 2px solid var(--border);
            width: 240px;
        }
        .hp-bar {
            background: #444;
            border-radius: 12px;
            height: 16px;
            margin: 10px 0;
            overflow: hidden;
        }
        .hp-fill {
            background: #2ecc71;
            height: 100%;
            width: 100%;
            transition: width 0.3s;
        }
        .move-btn {
            display: block;
            width: 100%;
            padding: 10px;
            margin: 6px 0;
            border-radius: 14px;
            background: var(--blue);
            color: white;
            border: none;
            cursor: pointer;
            font-weight: 700;
            transition: 0.2s;
        }
        .friend-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .friend-entry {
            background: var(--surface);
            border-radius: var(--radius);
            padding: 16px;
            border: 2px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .chat-window {
            background: var(--surface);
            border-radius: var(--radius);
            padding: 20px;
            border: 2px solid var(--border);
            max-height: 350px;
            overflow-y: auto;
            margin-top: 16px;
        }
        .quiz-option {
            display: block;
            width: 100%;
            padding: 14px;
            margin: 8px 0;
            background: var(--card-bg);
            border: 2px solid var(--border);
            border-radius: 14px;
            color: var(--text);
            cursor: pointer;
            font-weight: 700;
            transition: 0.2s;
            text-align: left;
            font-size: 1rem;
        }
        .quiz-option:hover {
            background: var(--blue);
            color: white;
        }
        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
    </style>
</head>
<body>
    <header class="header">
        <div class="logo">
            <div class="pokeball-logo"></div> PokéHub
        </div>
        <div class="trainer-box">
            <input type="text" id="trainer-name-input" placeholder="Trainer name" maxlength="14">
            <button id="save-trainer-btn">Save</button>
        </div>
        <div class="coins">
            <span class="coin-icon"></span> <span id="coin-balance">500</span> Coins
        </div>
        <nav class="nav-tabs" id="nav-tabs">
            <button class="nav-btn active" data-tab="collection">Collection</button>
            <button class="nav-btn" data-tab="packs">Packs</button>
            <button class="nav-btn" data-tab="battle">Battle</button>
            <button class="nav-btn" data-tab="trades">Trades</button>
            <button class="nav-btn" data-tab="friends">Friends</button>
            <button class="nav-btn" data-tab="learn">Quiz</button>
            <button class="nav-btn" data-tab="index">Index</button>
        </nav>
    </header>

    <main class="main-content">
        <div class="tab-view visible" id="collection-view">
            <h2 style="margin-bottom:20px; font-size:1.8rem;">My Collection</h2>
            <div class="card-grid" id="collection-grid"><p style="color:var(--text-secondary);">Loading...</p></div>
        </div>
        <div class="tab-view" id="packs-view">
            <h2 style="margin-bottom:20px; font-size:1.8rem;">Booster Packs</h2>
            <div class="pack-selection" id="pack-selection"></div>
            <div class="pack-rip-area" id="pack-rip-area" style="display:none;">
                <h3>Rip open your pack!</h3>
                <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/5/53/Pok%C3%A9_Ball_icon.svg/1200px-Pok%C3%A9_Ball_icon.svg.png" 
                     class="pack-image" id="pack-rip-image" alt="Rip pack" width="200">
                <p>Click and drag to tear open!</p>
            </div>
            <div class="flip-container" id="pack-flip-container"></div>
        </div>
        <div class="tab-view" id="battle-view">
            <h2 style="margin-bottom:20px; font-size:1.8rem;">Arena Battle</h2>
            <div class="battle-screen" id="battle-screen"></div>
            <button class="btn btn-primary" id="find-battle-btn" style="margin-top:20px;">Find Opponent</button>
        </div>
        <div class="tab-view" id="trades-view">
            <h2 style="margin-bottom:20px; font-size:1.8rem;">Trade Offers</h2>
            <div id="offers-container"></div>
            <button class="btn btn-gold" id="refresh-offers-btn" style="margin-top:20px;">Refresh Offers</button>
        </div>
        <div class="tab-view" id="friends-view">
            <h2 style="margin-bottom:20px; font-size:1.8rem;">Friends & Chat</h2>
            <div style="display:flex;gap:12px;margin-bottom:20px;">
                <input type="text" id="friend-name-input" placeholder="Add friend by name" style="flex:1;padding:12px 20px;border-radius:30px;background:var(--bg);border:2px solid var(--border);color:var(--text);font-size:1rem;">
                <button id="add-friend-btn" class="btn btn-primary">Add</button>
            </div>
            <div class="friend-list" id="friend-list"></div>
            <div class="chat-window" id="chat-window"></div>
        </div>
        <div class="tab-view" id="learn-view">
            <h2 style="margin-bottom:20px; font-size:1.8rem;">Pokémon Quiz</h2>
            <div id="quiz-container"><p>Loading quiz...</p></div>
        </div>
        <div class="tab-view" id="index-view">
            <h2 style="margin-bottom:20px; font-size:1.8rem;">Pokédex Index</h2>
            <button class="btn btn-primary" id="load-all-btn">Load All Pokémon</button>
            <table class="index-table">
                <thead><tr><th>ID</th><th>Name</th><th>Type</th><th>Rarity</th></tr></thead>
                <tbody id="index-body"></tbody>
            </table>
        </div>
    </main>

    <div class="modal-overlay" id="detail-modal">
        <div class="modal-panel">
            <button class="modal-close" id="modal-close">&times;</button>
            <img id="modal-sprite" src="" style="width:130px;height:130px;image-rendering:pixelated;" alt="">
            <h2 id="modal-name" style="text-transform:capitalize; margin:12px 0;"></h2>
            <div id="modal-types" style="margin:8px 0;"></div>
            <p style="font-size:1.1rem;">HP: <span id="modal-hp"></span> | ATK: <span id="modal-atk"></span> | DEF: <span id="modal-def"></span></p>
            <p style="font-size:1.1rem;">SP.ATK: <span id="modal-spatk"></span> | SP.DEF: <span id="modal-spdef"></span> | SPD: <span id="modal-speed"></span></p>
            <p id="modal-fact" style="color:var(--text-secondary); margin-top:16px;"></p>
        </div>
    </div>

    <div class="tutorial-overlay" id="tutorial-overlay">
        <div class="tutorial-box">
            <button class="tutorial-close" id="tutorial-close-btn">&times;</button>
            <h2>Welcome, Trainer!</h2>
            <p class="tutorial-step" id="tutorial-text"></p>
            <div class="tutorial-nav">
                <button class="btn" id="tutorial-prev">Previous</button>
                <button class="btn btn-primary" id="tutorial-next">Next</button>
            </div>
        </div>
    </div>

    <script>
        (function() {
            const allPokemon = [];
            const collection = new Set();
            let coins = 500;
            let trainerName = "Trainer";
            let currentTab = 'collection';
            let tutorialStep = 0;
            const tutorialSteps = [
                "Welcome to PokéHub! I'll guide you through collecting, battling, and trading. Use the arrows or X to skip.",
                "Your Collection shows your cards. Click any card to see details. Let's open your free daily pack! Click Next to go to Packs.",
                "In the Packs tab, you can rip open a free pack. Try clicking and dragging on the pack image!",
                "Use coins to buy more packs. Earn coins by battling in the Battle tab. Click Find Opponent and choose moves!",
                "Trade with AI trainers in Trades, or add friends and chat in the Friends tab. Your trainer name is used everywhere.",
                "Test your knowledge in the Quiz, or browse the complete Index. Have fun!"
            ];
            let friends = [];
            let messages = {};

            // ---------- SAVE/LOAD ----------
            function saveGame() {
                const saveData = {
                    coins,
                    trainer: trainerName,
                    collection: Array.from(collection),
                    friends,
                    messages
                };
                localStorage.setItem('pokehub_save', JSON.stringify(saveData));
            }

            function loadGame() {
                const saved = localStorage.getItem('pokehub_save');
                if (saved) {
                    try {
                        const data = JSON.parse(saved);
                        coins = data.coins || 500;
                        trainerName = data.trainer || 'Trainer';
                        collection.clear();
                        (data.collection || []).forEach(id => collection.add(id));
                        friends = data.friends || [];
                        messages = data.messages || {};
                    } catch (e) {}
                }
            }

            function updateCoinDisplay() {
                document.getElementById('coin-balance').textContent = coins;
                saveGame();
            }

            // Daily free pack check
            function canClaimFreePack() {
                const last = localStorage.getItem('pokehub_lastFreePack');
                if (!last) return true;
                const now = new Date().getTime();
                const oneDay = 24 * 60 * 60 * 1000;
                return (now - parseInt(last)) > oneDay;
            }

            function claimFreePack() {
                if (!canClaimFreePack()) return alert('You already claimed your free pack today!');
                localStorage.setItem('pokehub_lastFreePack', new Date().getTime().toString());
                openFreePack();
            }

            // ---------- RARITY ----------
            function getRarity(bst) {
                if (bst >= 600) return { name: 'Legendary', cls: 'rarity-legendary' };
                if (bst >= 550) return { name: 'Ultra Rare', cls: 'rarity-ultrarare' };
                if (bst >= 450) return { name: 'Rare', cls: 'rarity-rare' };
                if (bst >= 350) return { name: 'Uncommon', cls: 'rarity-uncommon' };
                return { name: 'Common', cls: 'rarity-common' };
            }

            // ---------- API ----------
            async function fetchPokemon(id) {
                const res = await fetch(`https://pokeapi.co/api/v2/pokemon/${id}`);
                const data = await res.json();
                const bst = data.stats.reduce((s, st) => s + st.base_stat, 0);
                const rarity = getRarity(bst);
                const sprite = data.sprites.versions?.['generation-v']?.['black-white']?.front_default || data.sprites
                    .front_default;
                return {
                    id: data.id,
                    name: data.name,
                    sprite,
                    types: data.types.map(t => t.type.name),
                    stats: {
                        hp: data.stats[0].base_stat,
                        attack: data.stats[1].base_stat,
                        defense: data.stats[2].base_stat,
                        speed: data.stats[5].base_stat,
                        spatk: data.stats[3].base_stat,
                        spdef: data.stats[4].base_stat
                    },
                    moves: (data.moves || []).slice(0, 4).map(m => m.move.name.replace('-', ' ')),
                    fact: `${data.name} is a ${data.types.map(t => t.type.name).join('/')} type. Base stat total: ${bst}.`
                };
            }

            async function loadRange(start, end) {
                const proms = [];
                for (let i = start; i <= end; i++) proms.push(fetchPokemon(i));
                const res = await Promise.all(proms);
                allPokemon.push(...res);
            }

            // ---------- RENDER CARDS ----------
            function createCardElement(pokemon) {
                const card = document.createElement('div');
                card.className = 'pokemon-card';
                card.innerHTML = `
                    <div class="card-sprite"><img src="${pokemon.sprite}" alt="${pokemon.name}" loading="lazy"></div>
                    <div class="card-info">
                        <div class="card-name">${pokemon.name}</div>
                        <span class="rarity-badge ${pokemon.rarity.cls}">${pokemon.rarity.name}</span>
                        <div>${pokemon.types.map(t => `<span class="type-badge type-${t}">${t}</span>`).join('')}</div>
                    </div>`;
                card.addEventListener('click', () => showDetail(pokemon));
                return card;
            }

            function renderCollection() {
                const owned = allPokemon.filter(p => collection.has(p.id));
                const grid = document.getElementById('collection-grid');
                grid.innerHTML = owned.length ? '' : '<p style="color:var(--text-secondary);">No cards yet. Open packs!</p>';
                owned.forEach(p => grid.appendChild(createCardElement(p)));
                saveGame();
            }

            function showDetail(pokemon) {
                document.getElementById('modal-sprite').src = pokemon.sprite;
                document.getElementById('modal-name').textContent = pokemon.name;
                document.getElementById('modal-types').innerHTML = pokemon.types.map(t =>
                    `<span class="type-badge type-${t}">${t}</span>`).join('');
                document.getElementById('modal-hp').textContent = pokemon.stats.hp;
                document.getElementById('modal-atk').textContent = pokemon.stats.attack;
                document.getElementById('modal-def').textContent = pokemon.stats.defense;
                document.getElementById('modal-spatk').textContent = pokemon.stats.spatk;
                document.getElementById('modal-spdef').textContent = pokemon.stats.spdef;
                document.getElementById('modal-speed').textContent = pokemon.stats.speed;
                document.getElementById('modal-fact').textContent = pokemon.fact || '';
                document.getElementById('detail-modal').classList.add('visible');
            }

            function closeDetailModal() {
                document.getElementById('detail-modal').classList.remove('visible');
            }

            // ---------- PACKS ----------
            const packTypes = [
                { name: 'Basic', cost: 100, cards: 3, w: { C: 70, U: 20, R: 8, UR: 2, L: 0 } },
                { name: 'Great', cost: 300, cards: 5, w: { C: 40, U: 30, R: 20, UR: 8, L: 2 } },
                { name: 'Ultra', cost: 600, cards: 5, w: { C: 20, U: 25, R: 30, UR: 18, L: 7 } },
                { name: 'Master', cost: 1200, cards: 5, w: { C: 5, U: 15, R: 30, UR: 30, L: 20 } }
            ];

            function renderPackSelection() {
                document.getElementById('pack-selection').innerHTML = packTypes.map(p => `
                    <div class="pack-card" data-pack="${p.name}">
                        <div class="pack-icon"><span>${p.name[0]}</span><span>P</span></div>
                        <strong style="font-size:1.2rem;">${p.name} Pack</strong>
                        <div style="color:var(--gold); font-weight:700;">${p.cost} Coins</div>
                        <div>${p.cards} cards</div>
                    </div>`).join('');
                document.querySelectorAll('.pack-card').forEach(el => {
                    el.addEventListener('click', () => {
                        const packName = el.dataset.pack;
                        if (packName === 'Free') {
                            claimFreePack();
                            return;
                        }
                        const pack = packTypes.find(p => p.name === packName);
                        if (coins < pack.cost) return alert('Not enough coins!');
                        coins -= pack.cost;
                        updateCoinDisplay();
                        openPack(pack);
                    });
                });
                // Add free daily pack
                const freeDiv = document.createElement('div');
                freeDiv.className = 'pack-card';
                freeDiv.innerHTML = `
                    <div class="pack-icon"><span>F</span><span>P</span></div>
                    <strong style="font-size:1.2rem;">Free Daily</strong>
                    <div style="color:var(--gold);">0 Coins</div>
                    <div>3 cards</div>`;
                freeDiv.addEventListener('click', claimFreePack);
                document.getElementById('pack-selection').appendChild(freeDiv);
            }

            function openFreePack() {
                openPack({ cost: 0, cards: 3, w: { C: 70, U: 20, R: 8, UR: 2, L: 0 } });
            }

            function openPack(pack) {
                const pool = [...allPokemon];
                const selected = [];
                for (let i = 0; i < pack.cards; i++) {
                    const roll = Math.random() * 100;
                    let rarity = 'C';
                    let cum = 0;
                    for (const [r, w] of Object.entries(pack.w)) { cum += w; if (roll <= cum) { rarity = r; break; } }
                    const candidates = pool.filter(p => p.rarity?.name?.[0] === rarity);
                    const pick = candidates.length ? candidates[Math.floor(Math.random() * candidates.length)] : pool[Math
                        .floor(Math.random() * pool.length)];
                    selected.push(pick);
                    collection.add(pick.id);
                }
                // Show rip area animation
                showRipAnimation(selected);
            }

            function showRipAnimation(cards) {
                const ripArea = document.getElementById('pack-rip-area');
                ripArea.style.display = 'block';
                const flipContainer = document.getElementById('pack-flip-container');
                flipContainer.innerHTML = '';
                const packImage = document.getElementById('pack-rip-image');
                let ripCount = 0;
                packImage.onmousedown = function(e) {
                    e.preventDefault();
                    ripCount++;
                    if (ripCount >= 3) {
                        ripArea.style.display = 'none';
                        revealCards(cards);
                    }
                };
                packImage.ontouchstart = function(e) {
                    e.preventDefault();
                    ripCount++;
                    if (ripCount >= 3) {
                        ripArea.style.display = 'none';
                        revealCards(cards);
                    }
                };
            }

            function revealCards(cards) {
                const container = document.getElementById('pack-flip-container');
                container.innerHTML = '';
                cards.forEach((pokemon, i) => {
                    const flipCard = document.createElement('div');
                    flipCard.className = 'flip-card';
                    flipCard.innerHTML = `
                        <div class="flip-card-inner">
                            <div class="flip-card-back">?</div>
                            <div class="flip-card-front">
                                <img src="${pokemon.sprite}" alt="${pokemon.name}">
                                <strong style="text-transform:capitalize;">${pokemon.name}</strong>
                                <span class="rarity-badge ${pokemon.rarity.cls}">${pokemon.rarity.name}</span>
                            </div>
                        </div>`;
                    container.appendChild(flipCard);
                    setTimeout(() => flipCard.classList.add('flipped'), 500 * (i + 1));
                });
                renderCollection();
            }

            // ---------- BATTLE ----------
            let currentBattle = null;

            function generateMoves(pokemon) {
                const moveMap = {
                    fire: ['Ember', 'Fire Spin'],
                    water: ['Water Gun', 'Bubble'],
                    grass: ['Vine Whip', 'Razor Leaf'],
                    electric: ['Thunder Shock', 'Spark'],
                    psychic: ['Confusion', 'Psybeam'],
                    normal: ['Tackle', 'Quick Attack'],
                    fighting: ['Karate Chop', 'Low Kick'],
                    dark: ['Bite', 'Feint Attack'],
                    steel: ['Metal Claw', 'Iron Head'],
                    ice: ['Ice Shard', 'Frost Breath'],
                    poison: ['Poison Sting', 'Acid'],
                    ground: ['Mud Slap', 'Dig'],
                    flying: ['Peck', 'Wing Attack'],
                    bug: ['String Shot', 'Bug Bite'],
                    rock: ['Rock Throw', 'Rollout'],
                    ghost: ['Lick', 'Shadow Sneak'],
                    dragon: ['Dragon Rage', 'Twister'],
                    fairy: ['Fairy Wind', 'Disarming Voice']
                };
                return moveMap[pokemon.types[0]] || ['Tackle', 'Growl'];
            }

            function startBattle() {
                const owned = allPokemon.filter(p => collection.has(p.id));
                if (!owned.length) return alert('You need cards to battle!');
                const player = owned[Math.floor(Math.random() * owned.length)];
                const opponent = allPokemon[Math.floor(Math.random() * allPokemon.length)];
                currentBattle = {
                    player: { ...player, hp: player.stats.hp, maxHp: player.stats.hp },
                    opponent: { ...opponent, hp: opponent.stats.hp, maxHp: opponent.stats.hp },
                    playerMoves: generateMoves(player),
                    opponentMoves: generateMoves(opponent)
                };
                renderBattle();
            }

            function renderBattle() {
                if (!currentBattle) return;
                const b = currentBattle;
                document.getElementById('battle-screen').innerHTML = `
                    <div class="battle-pokemon">
                        <h3>Opponent ${b.opponent.name}</h3>
                        <img src="${b.opponent.sprite}" style="width:120px;height:120px;">
                        <div class="hp-bar"><div class="hp-fill" style="width:${(b.opponent.hp/b.opponent.maxHp)*100}%"></div></div>
                        <p>HP: ${b.opponent.hp}/${b.opponent.maxHp}</p>
                    </div>
                    <div class="battle-pokemon">
                        <h3>Your ${b.player.name}</h3>
                        <img src="${b.player.sprite}" style="width:120px;height:120px;">
                        <div class="hp-bar"><div class="hp-fill" style="width:${(b.player.hp/b.player.maxHp)*100}%"></div></div>
                        <p>HP: ${b.player.hp}/${b.player.maxHp}</p>
                        ${b.playerMoves.map((m,i) => `<button class="move-btn" data-move="${i}">${m}</button>`).join('')}
                    </div>`;
                document.querySelectorAll('.move-btn').forEach(btn => {
                    btn.addEventListener('click', function() {
                        const idx = parseInt(this.dataset.move);
                        executeMove(idx);
                    });
                });
            }

            function executeMove(idx) {
                if (!currentBattle) return;
                const b = currentBattle;
                const dmg = Math.floor(Math.random() * 20) + 10;
                b.opponent.hp = Math.max(0, b.opponent.hp - dmg);
                if (b.opponent.hp <= 0) {
                    const reward = Math.floor(Math.random() * 30) + 20;
                    coins += reward;
                    updateCoinDisplay();
                    alert(`You won! +${reward} Coins`);
                    currentBattle = null;
                    document.getElementById('battle-screen').innerHTML = '';
                    return;
                }
                const oDmg = Math.floor(Math.random() * 20) + 5;
                b.player.hp = Math.max(0, b.player.hp - oDmg);
                if (b.player.hp <= 0) {
                    alert('You lost!');
                    currentBattle = null;
                    document.getElementById('battle-screen').innerHTML = '';
                    return;
                }
                renderBattle();
            }

            // ---------- TRADES ----------
            function generateOffers() {
                if (!collection.size) return document.getElementById('offers-container').innerHTML = '<p>No cards.</p>';
                const names = ['Red', 'Blue', 'Green', 'Silver', 'Diamond'];
                const offs = [];
                for (let i = 0; i < 3; i++) {
                    const reqId = Array.from(collection)[Math.floor(Math.random() * collection.size)];
                    const off = allPokemon[Math.floor(Math.random() * allPokemon.length)];
                    if (reqId === off.id) continue;
                    offs.push({ trainer: names[Math.floor(Math.random() * names.length)], req: allPokemon.find(p => p.id ===
                            reqId), off });
                }
                document.getElementById('offers-container').innerHTML = offs.map(o => `
                    <div class="trade-offer">
                        <strong>${o.trainer}</strong> wants ${o.req.name}
                        <img src="${o.req.sprite}" width="50"> &rarr;
                        <img src="${o.off.sprite}" width="50"> ${o.off.name}
                        <button class="btn btn-accept" data-req="${o.req.id}" data-off="${o.off.id}">Accept</button>
                        <button class="btn btn-decline">Decline</button>
                    </div>`).join('');
                document.querySelectorAll('.btn-accept').forEach(b => b.addEventListener('click', function() {
                    const reqId = +this.dataset.req;
                    const offId = +this.dataset.off;
                    if (collection.has(reqId)) { collection.delete(reqId);
                        collection.add(offId);
                        renderCollection();
                        generateOffers(); }
                }));
                document.querySelectorAll('.btn-decline').forEach(b => b.addEventListener('click', generateOffers));
            }

            // ---------- FRIENDS ----------
            function addFriend() {
                const name = document.getElementById('friend-name-input').value.trim();
                if (!name || friends.includes(name)) return;
                friends.push(name);
                document.getElementById('friend-name-input').value = '';
                saveGame();
                renderFriends();
            }

            function renderFriends() {
                const list = document.getElementById('friend-list');
                list.innerHTML = friends.map(f => `
                    <div class="friend-entry">
                        <span>${f}</span>
                        <div style="display:flex;gap:10px;">
                            <button class="btn btn-primary chat-btn" data-friend="${f}">Chat</button>
                            <button class="btn btn-gold trade-btn" data-friend="${f}">Trade</button>
                        </div>
                    </div>`).join('') || '<p>No friends added.</p>';
                document.querySelectorAll('.chat-btn').forEach(b => b.addEventListener('click', function() { openChat(this
                        .dataset.friend); }));
                document.querySelectorAll('.trade-btn').forEach(b => b.addEventListener('click', function() {
                    sendTradeToFriend(this.dataset.friend); }));
            }

            function openChat(friend) {
                const chat = document.getElementById('chat-window');
                chat.innerHTML = (messages[friend] || []).map(m => `<div><strong>${m.from}:</strong> ${m.text}</div>`).join(
                    '') +
                    `<div style="display:flex;gap:10px;margin-top:12px;">
                        <input id="chat-input" placeholder="Message..." style="flex:1;padding:10px;border-radius:20px;background:var(--bg);border:2px solid var(--border);color:var(--text);">
                        <button class="btn btn-primary" id="send-chat-btn">Send</button>
                    </div>`;
                document.getElementById('send-chat-btn').addEventListener('click', () => sendMessage(friend));
            }

            function sendMessage(friend) {
                const input = document.getElementById('chat-input');
                const text = input.value.trim();
                if (!text) return;
                if (!messages[friend]) messages[friend] = [];
                messages[friend].push({ from: trainerName, text });
                saveGame();
                openChat(friend);
            }

            function sendTradeToFriend(friend) {
                const owned = allPokemon.filter(p => collection.has(p.id));
                if (!owned.length) return alert('No cards to trade.');
                const req = owned[Math.floor(Math.random() * owned.length)];
                const off = allPokemon[Math.floor(Math.random() * allPokemon.length)];
                if (req.id === off.id) return;
                if (confirm(`Offer ${friend} your ${req.name} for ${off.name}?`)) alert('Trade sent!');
            }

            // ---------- QUIZ ----------
            function renderQuiz() {
                if (!allPokemon.length) return;
                const pokemon = allPokemon[Math.floor(Math.random() * allPokemon.length)];
                const questions = [
                    { q: `What type is ${pokemon.name}?`, a: pokemon.types[0], opts: ['water', 'fire', 'grass',
                    'normal'] },
                    { q: `What is ${pokemon.name}'s base HP?`, a: pokemon.stats.hp.toString(), opts: ['50', '60', '70',
                        '80'] }
                ];
                const q = questions[Math.floor(Math.random() * questions.length)];
                const opts = [...new Set([q.a, ...q.opts.filter(o => o !== q.a)].slice(0, 4))].sort(() => Math.random() -
                    0.5);
                document.getElementById('quiz-container').innerHTML = `<h3>${q.q}</h3>` + opts.map(o =>
                    `<button class="quiz-option">${o}</button>`).join('');
                document.querySelectorAll('.quiz-option').forEach(b => b.addEventListener('click', function() {
                    if (this.textContent === q.a) alert('Correct!');
                    else alert(`Wrong! It's ${q.a}.`);
                    renderQuiz();
                }));
            }

            // ---------- INDEX ----------
            function renderIndex() {
                document.getElementById('index-body').innerHTML = allPokemon.map(p => `
                    <tr>
                        <td>#${p.id}</td>
                        <td style="text-transform:capitalize;color:var(--gold);cursor:pointer" class="idx-name" data-id="${p.id}">${p.name}</td>
                        <td>${p.types.map(t => `<span class="type-badge type-${t}">${t}</span>`).join('')}</td>
                        <td><span class="rarity-badge ${p.rarity.cls}">${p.rarity.name}</span></td>
                    </tr>`).join('');
                document.querySelectorAll('.idx-name').forEach(el => el.addEventListener('click', function() {
                    const id = +this.dataset.id;
                    const pokemon = allPokemon.find(p => p.id === id);
                    if (pokemon) showDetail(pokemon);
                }));
            }

            async function loadAll() {
                const btn = document.getElementById('load-all-btn');
                btn.disabled = true;
                btn.textContent = 'Loading...';
                for (let i = 152; i <= 898; i += 100) {
                    await loadRange(i, Math.min(i + 99, 898));
                }
                renderIndex();
                btn.textContent = 'All Loaded!';
            }

            // ---------- TABS ----------
            function switchTab(tab) {
                document.querySelectorAll('.tab-view').forEach(v => v.classList.remove('visible'));
                document.getElementById(`${tab}-view`).classList.add('visible');
                document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
                document.querySelector(`.nav-btn[data-tab="${tab}"]`).classList.add('active');
                if (tab === 'collection') renderCollection();
                if (tab === 'packs') renderPackSelection();
                if (tab === 'trades') generateOffers();
                if (tab === 'friends') renderFriends();
                if (tab === 'learn') renderQuiz();
                if (tab === 'index') renderIndex();
            }

            // ---------- TUTORIAL (fixed) ----------
            function updateTutorial() {
                document.getElementById('tutorial-text').textContent = tutorialSteps[tutorialStep];
                document.getElementById('tutorial-prev').style.visibility = tutorialStep === 0 ? 'hidden' : 'visible';
                document.getElementById('tutorial-next').textContent = tutorialStep === tutorialSteps.length - 1 ?
                'Finish' : 'Next';
            }

            function startTutorial() {
                tutorialStep = 0;
                updateTutorial();
                document.getElementById('tutorial-overlay').style.display = 'flex';
            }

            function closeTutorial() {
                document.getElementById('tutorial-overlay').style.display = 'none';
                localStorage.setItem('pokehub_tutorial', 'true');
            }

            function nextTutorial() {
                if (tutorialStep < tutorialSteps.length - 1) {
                    tutorialStep++;
                    updateTutorial();
                    // Interactive: switch to packs tab on step 2
                    if (tutorialStep === 2) switchTab('packs');
                } else closeTutorial();
            }

            // ---------- INIT ----------
            async function init() {
                loadGame();
                document.getElementById('trainer-name-input').value = trainerName;
                updateCoinDisplay();
                if (!allPokemon.length) {
                    await loadRange(1, 151);
                }
                renderCollection();
                renderPackSelection();
                renderFriends();

                document.getElementById('save-trainer-btn').addEventListener('click', () => {
                    trainerName = document.getElementById('trainer-name-input').value.trim() || 'Trainer';
                    saveGame();
                });
                document.getElementById('modal-close').addEventListener('click', closeDetailModal);
                document.getElementById('detail-modal').addEventListener('click', e => { if (e.target === document
                        .getElementById('detail-modal')) closeDetailModal(); });
                document.getElementById('find-battle-btn').addEventListener('click', startBattle);
                document.getElementById('refresh-offers-btn').addEventListener('click', generateOffers);
                document.getElementById('add-friend-btn').addEventListener('click', addFriend);
                document.getElementById('load-all-btn').addEventListener('click', loadAll);
                document.getElementById('tutorial-next').addEventListener('click', nextTutorial);
                document.getElementById('tutorial-prev').addEventListener('click', () => { if (tutorialStep > 0) {
                        tutorialStep--;
                        updateTutorial(); } });
                document.getElementById('tutorial-close-btn').addEventListener('click', closeTutorial);
                document.querySelectorAll('.nav-btn[data-tab]').forEach(b => b.addEventListener('click', function() {
                    switchTab(this.dataset.tab); }));

                if (!localStorage.getItem('pokehub_tutorial')) startTutorial();
                else if (canClaimFreePack()) alert('You have a free pack available!');
            }
            init();
        })();
    </script>
</body>
</html>
